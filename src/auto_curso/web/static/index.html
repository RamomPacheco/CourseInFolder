<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video Learning Tracker</title>
<link rel="stylesheet" href="/vendor/phosphor/regular/style.css" />
<link rel="stylesheet" href="/vendor/phosphor/fill/style.css" />
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<div id="app">
  <div class="nav">
    <div class="nav-brand" id="brand-link">
      <i class="ph-fill ph-graduation-cap" style="color:var(--color-accent);"></i>
      Video Learning Tracker
    </div>
    <div style="flex:1;max-width:420px;">
      <input class="input" id="search-input" type="text" placeholder="Buscar cursos..." />
    </div>
    <button class="btn btn-primary" id="add-course-btn">
      <i class="ph ph-folder-plus"></i> Adicionar curso
    </button>
  </div>

  <!-- LIBRARY VIEW -->
  <section id="view-library" class="view">
    <div id="continue-watching-wrap"></div>
    <h2 class="section-title">Meus cursos</h2>
    <div id="course-grid" class="course-grid"></div>
  </section>

  <!-- PLAYER VIEW -->
  <section id="view-player" class="view hidden player-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <button class="btn btn-ghost" id="back-btn"><i class="ph ph-arrow-left"></i> Cursos</button>
        <div class="card-title" id="course-title" style="margin-top:var(--space-2);"></div>
        <div class="card-meta" id="course-meta"></div>
        <div class="progress-bar"><span id="course-progress-bar" style="width:0%"></span></div>
        <div class="filter-row" id="filter-seg">
          <button class="btn btn-ghost filter-btn active" data-filter="all">Todos</button>
          <button class="btn btn-ghost filter-btn" data-filter="pending">Pendentes</button>
          <button class="btn btn-ghost filter-btn" data-filter="completed">Concluídos</button>
        </div>
        <button class="btn btn-secondary btn-block" id="refresh-course-btn"><i class="ph ph-arrows-clockwise"></i> Atualizar</button>
        <button class="btn btn-secondary btn-block" id="remove-course-btn"><i class="ph ph-trash"></i> Remover curso</button>
      </div>
      <div class="sidebar-list" id="sidebar-list"></div>
    </aside>

    <div class="player-main">
      <div class="player-surface" id="player-surface">
        <video id="player-video" class="hidden"></video>
        <div class="player-empty" id="player-empty">Selecione uma aula</div>
      </div>

      <div class="player-controls">
        <div class="controls-row">
          <button class="btn-icon" id="play-btn"><i class="ph-fill ph-play" id="play-icon"></i></button>
          <button class="btn-icon" id="skip-back-btn"><i class="ph ph-arrow-counter-clockwise"></i></button>
          <button class="btn-icon" id="skip-fwd-btn"><i class="ph ph-arrow-clockwise"></i></button>
          <span class="time-label" id="time-label">--:-- / --:--</span>
          <input type="range" id="seek-range" class="seek-range" min="0" max="100" value="0" step="0.1" />
          <select class="input speed-select" id="speed-select">
            <option value="0.75">0.75x</option>
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="1.75">1.75x</option>
            <option value="2">2x</option>
          </select>
          <button class="btn-icon" id="fullscreen-btn"><i class="ph ph-corners-out"></i></button>
          <button class="btn btn-ghost" id="complete-btn"><i class="ph ph-check-circle"></i> Marcar como concluída</button>
        </div>
        <div class="card-title" id="player-video-title" style="font-size:15px;"></div>
      </div>

      <div class="player-tabs">
        <button class="btn btn-ghost tab-btn active" data-tab="notes"><i class="ph ph-note-pencil"></i> Anotações do vídeo</button>
        <button class="btn btn-ghost tab-btn" data-tab="course-notes"><i class="ph ph-notebook"></i> Notas do curso</button>
        <button class="btn btn-ghost tab-btn" data-tab="materials"><i class="ph ph-paperclip"></i> Materiais (<span id="materials-count">0</span>)</button>
      </div>

      <div class="player-tab-content">
        <div id="tab-notes" class="tab-pane">
          <div class="note-input-row">
            <input class="input" id="note-input" placeholder="Escreva uma anotação no tempo atual..." />
            <button class="btn btn-primary" id="add-note-btn"><i class="ph ph-plus"></i> <span id="note-time-label">em 00:00</span></button>
          </div>
          <div id="notes-list"></div>
        </div>
        <div id="tab-course-notes" class="tab-pane hidden">
          <textarea class="input" id="course-note-textarea" style="width:100%;min-height:220px;resize:vertical;" placeholder="Notas gerais sobre o curso..."></textarea>
        </div>
        <div id="tab-materials" class="tab-pane hidden">
          <div id="materials-list"></div>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- ADD COURSE / FOLDER BROWSER DIALOG -->
<div id="browse-dialog" class="dialog-backdrop hidden">
  <div class="dialog" style="height:520px;">
    <div class="dialog-title">Adicionar curso</div>
    <div class="dialog-body">Escolha a pasta que contém os vídeos do curso.</div>
    <div class="browse-path" id="browse-path"></div>
    <ul class="browse-list" id="browse-list"></ul>
    <div class="field" style="margin-top:4px;">
      <label for="browse-manual-path">Ou informe o caminho diretamente</label>
      <input class="input" id="browse-manual-path" type="text" placeholder="/caminho/para/o/curso" />
    </div>
    <div class="dialog-actions">
      <button class="btn btn-secondary" id="browse-cancel-btn">Cancelar</button>
      <button class="btn btn-primary" id="browse-select-btn">Selecionar esta pasta</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
