[project]
name = "auto-curso"
version = "1.0.0"
description = "Acompanhamento de progresso em pastas de vídeo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "natsort>=8.4.0",
    "packaging==26.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "python-multipart>=0.0.32",
]

[project.scripts]
auto-curso-web = "auto_curso.web.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
