[project]
name = "auto-curso"
version = "1.0.0"
description = "Acompanhamento de progresso em pastas de vídeo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "natsort>=8.4.0",
]

[project.scripts]
auto-curso = "auto_curso.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
