[project]
name = "auto-curso"
version = "1.0.0"
description = "Acompanhamento de progresso em pastas de vídeo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "natsort>=8.4.0",
    "customtkinter==5.2.2",
    "darkdetect==0.8.0",
    "natsort==8.4.0",
    "packaging==26.2",
    "PySide6==6.11.1",
    "PySide6_Addons==6.11.1",
    "PySide6_Essentials==6.11.1",
    "python-vlc==3.0.21203",
    "shiboken6==6.11.1"
    ]

[project.scripts]
auto-curso = "auto_curso.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]
